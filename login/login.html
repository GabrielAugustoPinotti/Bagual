<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BAGUAL</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CUPOM -->
  <div class="top-bar">
    <p>
      15% OFF NA PRIMEIRA COMPRA:
      <strong>CUPOM BAGUAL15</strong>
    </p>
  </div>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar">

      <!-- LOGO -->
      <a href="../index.html" class="logo">
        <img src="../Assets/main/bagual.png"
             alt="Logo da Bagual"
             style="width: 200px; height: auto;">
      </a>

      <!-- MENU -->
      <div class="menu-right">

        <button type="button"
                onclick="window.location.href='login.html'">
          Entrar
        </button>
        <a href="../../registro/registro.html">
                    <button>Registrar-se</button>
                </a>
      </div>

    </nav>
  </header>

  <!-- LOGIN -->
  <div class="login-container">

    <div class="login-box">

      <!-- FORMULÁRIO -->
      <form action="../index.html">

        <label>Email</label>
        <input type="email"
               placeholder="Ex: conta@gmail.com"
               required>

        <label>Senha</label>
        <input type="password"
               placeholder="Senha"
               required>

        

        <button type="submit">
          Login
        </button>

      </form>

    </div>

  </div>

</body>

</html>
